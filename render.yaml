# ─────────────────────────────────────────────────────────────
#  Render Blueprint：TcBusBot（Discord Bot ＋ 健康檢查端點）
#
#  ⚠️ three 個欄位與常見草稿不同，都是有原因的：
#
#  1. `type: web`（不是 `worker`）
#     Render 的免費層**只有 Web Service**。Worker 需要付費方案，
#     而且 worker 不會被要求監聽埠 —— 但免費層的 Web Service 會。
#     所以 Bot 同時開一個 HTTP 端點（程式內建，見 HealthEndpoint.cs）。
#
#  2. `runtime: docker`（不是 `env: docker`）
#     Blueprint 規格的欄位名是 `runtime`；寫 `env` 不會生效。
#
#  3. `healthCheckPath: /health`
#     直接指到程式提供的端點（回 200 JSON），Render 就能正確判斷服務狀態，
#     不用另外寫一個靜態頁面。
#
#  ⚠️ 免費層沒有持久化磁碟：容器裡的 tcbus.db 每次重新部署都會清空。
#     要留住訂閱組請設 `TCBUS_MONGO`（MongoDB Atlas 免費層就夠）。
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: tcbusbot-discord
    runtime: docker
    repo: https://github.com/abo-nb/TcBusBot.git
    region: singapore # 可選：singapore / oregon / frankfurt / ohio（選離你最近的）
    plan: free

    # Docker 相關：Dockerfile 在子目錄，context 要是專案根目錄
    # （不然 COPY src/TcBusBot.Core 會找不到）
    dockerfilePath: src/TcBusBot.Discord/Dockerfile
    dockerContext: .

    # 健康檢查：程式提供 GET /health → 200 JSON（GET / 也可以）
    healthCheckPath: /health

    envVars:
      # ── 必填 ──────────────────────────────────────────────
      - key: DISCORD_TOKEN
        sync: false # 在 Render 後台填，不進 Git

      # ── 選填：有填才有真實到站時間（沒填會用內建離線資料集）──
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false

      # ── 選填但強烈建議：訂閱組存到 MongoDB（容器沒有持久化磁碟）──
      # 服務哪個城市的公車（預設臺中）。可以同時多個，用逗號分隔：
      #   Taichung,Tainan = 臺中＋臺南一起用（資料合併、ETA 按城市分批查）
      - key: BUS_CITY
        value: Taichung,Tainan
      - key: TCBUS_MONGO
        sync: false
      - key: TCBUS_MONGO_DB
        value: tcbus

      # ── 輪詢與防休眠 ──────────────────────────────────────
      # 30 秒 ≈ 60~80 點/月（TDX 銅級 200 點/月足夠）；想更省可設 60
      - key: TCBUS_POLL_INTERVAL
        value: "30"

      # 要監聽的埠。Render 預設會注入 PORT，這裡明確定成 8080 也可以
      # （程式讀 PORT，沒設時預設就是 8080）。想讓 Render 自己挑就刪掉這兩行。
      - key: PORT
        value: "8080"

      # 防休眠：程式會每 N 分鐘 ping 自己一次（沒設 APP_URL 時會自動用
      # Render 注入的 RENDER_EXTERNAL_URL）。免費層閒置約 15 分鐘會休眠。
      - key: KEEP_ALIVE_MINUTES
        value: "10"

      # ── 選填：AI 聊天（OpenAI 相容 API；有填 LLM_API_KEY 才會啟用）──
      # ⚠️ 啟用後程式會要求 Message Content 特權意圖，
      #    必須同時在 Discord Developer Portal → Bot → Privileged Gateway Intents
      #    打開 **Message Content Intent**，否則閘道會用 4014 拒絕連線（Bot 連不上）。
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-flash
      # 極短判斷（是在跟我說話嗎／換話題了沒）用的模型；留空＝跟主模型一樣。
      # 這兩種判斷只要回一個單字但次數多，用便宜的小模型就夠。
      - key: LLM_JUDGE_MODEL
        sync: false
      # 每週 token 上限（全域；UTC 週一 00:00 重置）。0 = 不限。
      - key: LLM_WEEKLY_TOKENS
        value: "300000"
      # 超過這個分鐘數沒說話就當成新的段落（不帶舊上下文）
      - key: LLM_SEGMENT_GAP_MINUTES
        value: "30"
      # 讓 LLM 用工具真的幫使用者訂閱公車（設 false 就只剩聊天）
      - key: LLM_TOOLS
        value: "true"
      # 模型思考：off 最省 token（實測同一個問題 out 660 → 20 tokens）
      - key: LLM_REASONING
        value: "off"
      # 讓模型看到「誰在說話」（暱稱 ＋ ID）與允許它 @ 使用者
      - key: LLM_EXPOSE_IDS
        value: "true"
      - key: LLM_ALLOW_MENTIONS
        value: "true"
      # 讓模型看到 Discord 暱稱（伺服器顯示名稱）而不是 @帳號；
      # 也會讓它知道自己在這個伺服器被叫什麼（把 Bot 改暱稱時很重要）
      - key: LLM_SHOW_NICKNAMES
        value: "true"
      # 「主人」授權：名單 ＋ 訊息裡必須帶的特殊 key（兩個都設才會生效）
      - key: LLM_ADMIN_IDS
        sync: false
      - key: LLM_ADMIN_KEY
        sync: false
      # 讓模型幫使用者按面板按鈕（開面板／設起訖／找路線／訂閱／復原）
      - key: LLM_UI_ACTIONS
        value: "true"
      # 偷聽模式：回完話後繼續聽沒 @ 它的訊息（接話／先不出聲／退出三種判斷）
      - key: LLM_EAVESDROP
        value: "true"
      # 判斷上限（成本上限；一群人聊天很容易超過，設太小會讓它聊兩句就退出）
      - key: LLM_EAVESDROP_MESSAGES
        value: "20"
      # 閒置窗：最後一則訊息之後這麼久沒人講話才停止偷聽（每則訊息都會往後延）
      - key: LLM_EAVESDROP_SECONDS
        value: "120"
      # 偷聽到的閒聊留下來當上下文（之後被 @ 時才接得上大家在聊什麼）
      - key: LLM_EAVESDROP_CONTEXT
        value: "true"
      # ── 多人同時說話：排隊等回覆（不是「忙就丟掉」）──────────
      # 每頻道最多排幾則（超過先丟閒聊、不丟 @ 它的）
      - key: LLM_CHANNEL_QUEUE
        value: "5"
      # 同一個人在幾秒內連打的訊息合併成一題（0 = 不合併）
      - key: LLM_MERGE_SECONDS
        value: "4"
      # 圖片理解：只有被 @ 或回覆的訊息才會附圖（偷聽到的照片不送）
      - key: LLM_VISION
        value: "true"
      - key: LLM_VISION_MAX_IMAGES
        value: "2"
      # ── 對話記憶的容量（記憶體用量；Render 免費層記憶體有限）──
      - key: LLM_MAX_TURNS_PER_SEGMENT
        value: "24"
      - key: LLM_MAX_SEGMENTS_PER_CHANNEL
        value: "4"
      - key: LLM_MAX_CHANNELS
        value: "500"
      - key: LLM_CHANNEL_TTL_HOURS
        value: "12"
      # ── 「學到的提示詞」要存多少（私人伺服器可放寬、公開的建議收緊）──
      - key: LLM_MAX_GUILD_RULES
        value: "40"
      - key: LLM_MAX_RULE_CHARS
        value: "300"
      - key: LLM_MAX_PERSONA_GUILDS
        value: "200"
      - key: LLM_MAX_OVERLAY_CHARS
        value: "2000"
      - key: LLM_MAX_AUDIT_ENTRIES
        value: "200"

      - key: DOTNET_ENVIRONMENT
        value: Production
